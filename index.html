<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My NSE Blast Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#edf2ff;font-family:Arial,sans-serif}
header{padding:18px;background:#141c30;border-bottom:1px solid #29344c}
h1{font-size:22px;margin:0 0 8px}
small{color:#aab7d0}
main{padding:14px;max-width:1000px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#151f33;border:1px solid #2a3852;border-radius:12px;padding:12px}
.num{font-size:23px;font-weight:bold;margin-top:8px}
nav{display:flex;gap:8px;overflow:auto;margin:16px 0}
button{background:#202d45;color:white;border:1px solid #35445f;border-radius:9px;padding:11px;cursor:pointer;white-space:nowrap}
button.active{background:#2864dc}
.stock{background:#151f33;border:1px solid #2a3852;border-radius:12px;padding:14px;margin:10px 0}
.stocktop{display:flex;justify-content:space-between;gap:8px}
.green{color:#48e0a0}.red{color:#ff737d}.yellow{color:#ffd166}
.tag{font-size:12px;background:#263650;padding:5px 8px;border-radius:6px}
.detail{color:#aab7d0;font-size:13px;line-height:1.8;margin-top:8px}
.note{font-size:12px;color:#ffd166;line-height:1.6}
h2{font-size:18px}
@media(max-width:420px){.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:19px}}
</style>
</head>
<body>
<header>
<h1>⚡ My NSE Blast Scanner</h1>
<div id="clock"></div>
<small>NSE India · Intraday · Demo mode only</small>
</header>
<main>
<div class="cards">
<div class="card">Bullish <div class="num green" id="bull">2</div></div>
<div class="card">Bearish <div class="num red" id="bear">2</div></div>
<div class="card">Blast 💥 <div class="num yellow" id="blast">2</div></div>
</div>
<nav id="tabs">
<button class="active" data-tab="Overview">Overview</button>
<button data-tab="Scanners">Scanners</button>
<button data-tab="Sectors">Sectors</button>
<button data-tab="Watchlist">Watchlist</button>
<button data-tab="API Settings">API Settings</button>
</nav>
<div id="content"></div>
<p class="note">⚠ Demo data only. Not live market data or trading advice. No trades are placed. Connect a secure backend and verified Kotak Neo API before using live signals.</p>
</main>
<script>
const stocks=[
 {s:"RELIANCE",sector:"Oil & Gas",side:"BULLISH",pdh:true,price:"Demo"},
 {s:"HDFCBANK",sector:"Private Banks",side:"BULLISH",pdh:false,price:"Demo"},
 {s:"SBIN",sector:"PSU Banks",side:"BEARISH",pdl:true,price:"Demo"},
 {s:"INFY",sector:"Software & Services",side:"BEARISH",pdl:false,price:"Demo"},
 {s:"TATASTEEL",sector:"Metals & Mining",side:"BULLISH",pdh:true,price:"Demo"}
];
const scanners=["Bullish Blast","Bearish Blast","PDH Breakout","PDL Breakdown","Scalping","Intraday Trend","Volume Blast","Reversal","Opening Range Breakout (ORB)","Fake Breakout / Retest"];
function updateClock(){
 document.getElementById("clock").textContent=
 new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"medium"})+" IST";
}
setInterval(updateClock,1000);updateClock();
function stockCard(x){
 let blast=(x.side==="BULLISH"&&x.pdh)||(x.side==="BEARISH"&&x.pdl);
 let cls=x.side==="BULLISH"?"green":"red";
 let label=x.side+(blast?" BLAST 💥":"");
 return `<div class="stock"><div class="stocktop"><strong>${x.s}</strong><span class="${cls}">${label}</span></div>
 <div class="detail">Sector: ${x.sector}<br>Price: DEMO — no live quote<br>Signal: illustrative only<br>PDH/PDL breakout: ${blast?"Demo condition true":"Not confirmed"}</div></div>`;
}
function show(tab){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 let c=document.getElementById("content");
 if(tab==="Overview") c="<h2>Market Overview</h2><p class='note'>Market sentiment is not calculated from live data.</p>"+stocks.map(stockCard).join("");
 else if(tab==="Scanners") c="<h2>10 Scanner Categories</h2>"+scanners.map(x=>`<div class="stock">${x}<div class="detail">Awaiting real market data and scanner logic.</div></div>`).join("");
 else if(tab==="Sectors") c="<h2>Sectors</h2>"+[...new Set(stocks.map(x=>x.sector))].map(x=>`<div class="stock">${x}</div>`).join("");
 else if(tab==="Watchlist") c="<h2>Watchlist</h2>"+stocks.map(stockCard).join("");
 else c="<h2>Kotak Neo API</h2><div class='stock'>Connection: <span class='yellow'>Not connected</span><p class='detail'>API credentials must be handled by a secure backend. Do not paste secrets into this page or GitHub.</p>Next: configure a backend and verify official Kotak Neo API documentation.</div>";
 document.getElementById("content").innerHTML=c;
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab)));
show("Overview");
</script>
</body>
</html>
