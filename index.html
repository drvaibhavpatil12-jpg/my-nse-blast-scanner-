<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Real-Time Live Scanner</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --border-color: #262c3a;
            --text-main: #e1e7ec;
            --text-sub: #8b949e;
            --accent-green: #00c853;
            --accent-red: #ff3d00;
            --accent-yellow: #ffd600;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        .indices-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .index-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
        .index-name { font-size: 14px; font-weight: bold; color: var(--text-sub); }
        .index-val { font-size: 18px; font-weight: bold; margin-top: 4px; }
        .control-bar { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; }
        button { padding: 12px 24px; background: var(--accent-green); color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:hover { opacity: 0.9; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; }
        .card-header { font-size: 15px; font-weight: bold; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .badge-green { background: rgba(0, 200, 83, 0.2); color: var(--accent-green); }
        .badge-red { background: rgba(255, 61, 0, 0.2); color: var(--accent-red); }
        .badge-yellow { background: rgba(255, 214, 0, 0.2); color: var(--accent-yellow); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 4px; }
        th { color: var(--text-sub); }
        tr:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .green { color: var(--accent-green); font-weight: bold; }
        .red { color: var(--accent-red); font-weight: bold; }
    </style>
</head>
<body>

    <div class="indices-bar">
        <div class="index-card">
            <div><div class="index-name">NIFTY 50</div><div class="index-val" id="nifty-val">Loading...</div></div>
            <span class="badge badge-green" id="nifty-change">--</span>
        </div>
        <div class="index-card">
            <div><div class="index-name">BANK NIFTY</div><div class="index-val" id="banknifty-val">Loading...</div></div>
            <span class="badge badge-red" id="banknifty-change">--</span>
        </div>
        <div class="index-card">
            <div><div class="index-name">STATUS</div><div class="index-val" id="status-val">READY</div></div>
            <span class="badge badge-yellow">DIRECT LIVE</span>
        </div>
    </div>

    <div class="control-bar">
        <span style="color: var(--text-sub);">Zero-Config Mode (No API Keys Needed)</span>
        <button onclick="fetchLiveData()">🔄 SCAN LIVE MARKET DATA</button>
    </div>

    <div class="grid-layout">
        <div class="card" style="border: 1px solid var(--accent-green);">
            <div class="card-header"><span>🟢 BULLISH STOCKS (Gainers)</span><span class="badge badge-green">Real Rates</span></div>
            <table>
                <thead><tr><th>Symbol</th><th>LTP (₹)</th><th>Chg %</th><th>Signal</th></tr></thead>
                <tbody id="table-buy-call"><tr><td colspan="4" style="color: var(--text-sub);">Click scan button...</td></tr></tbody>
            </table>
        </div>

        <div class="card" style="border: 1px solid var(--accent-red);">
            <div class="card-header"><span>🔴 BEARISH STOCKS (Losers)</span><span class="badge badge-red">Real Rates</span></div>
            <table>
                <thead><tr><th>Symbol</th><th>LTP (₹)</th><th>Chg %</th><th>Signal</th></tr></thead>
                <tbody id="table-sell-call"><tr><td colspan="4" style="color: var(--text-sub);">Click scan button...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchLiveData() {
            document.getElementById('status-val').innerText = "SCANNING...";
            try {
                const res = await fetch('https://nse-blast-backend.onrender.com/scan');
                const result = await res.json();
                
                if (result.success && result.data) {
                    let buyHtml = '';
                    let sellHtml = '';

                    result.data.forEach(item => {
                        const symbol = item.symbol;
                        const ltp = item.ltp;
                        const chg = item.chg;

                        if (symbol === "NIFTY 50") {
                            document.getElementById('nifty-val').innerText = ltp;
                            document.getElementById('nifty-change').innerText = (chg >= 0 ? '+' : '') + chg + '%';
                        } else if (symbol === "BANK NIFTY") {
                            document.getElementById('banknifty-val').innerText = ltp;
                            document.getElementById('banknifty-change').innerText = (chg >= 0 ? '+' : '') + chg + '%';
                        } else {
                            if (chg >= 0) {
                                buyHtml += `<tr><td><b>${symbol}</b></td><td class="green">₹${ltp}</td><td class="green">+${chg}%</td><td><span class="badge badge-green">BUY</span></td></tr>`;
                            } else {
                                sellHtml += `<tr><td><b>${symbol}</b></td><td class="red">₹${ltp}</td><td class="red">${chg}%</td><td><span class="badge badge-red">SELL</span></td></tr>`;
                            }
                        }
                    });

                    document.getElementById('status-val').innerText = "LIVE OK";
                    document.getElementById('table-buy-call').innerHTML = buyHtml || '<tr><td colspan="4">No Bullish Stocks</td></tr>';
                    document.getElementById('table-sell-call').innerHTML = sellHtml || '<tr><td colspan="4">No Bearish Stocks</td></tr>';

                } else {
                    alert("Error fetching live data!");
                    document.getElementById('status-val').innerText = "ERROR";
                }
            } catch (e) {
                alert("Server connecting... Please wait 30 seconds and click scan again!");
                document.getElementById('status-val').innerText = "RETRYING";
            }
        }

        // Auto fetch on load
        window.onload = fetchLiveData;
    </script>
</body>
</html>
